<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FEFL Beat · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f9ff;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-hover: #f1f5fd;
      --border: #e3eaf5;
      --border-strong: #c8d4ec;
      --text: #0f172a;
      --text-muted: #5b6b85;
      --text-soft: #8895ab;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #dbeafe;
      --accent: #7c3aed;
      --green: #10b981;
      --warning: #f59e0b;
      --critical: #dc2626;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
      --shadow-md: 0 4px 16px rgba(37, 99, 235, .08);
      --shadow-lg: 0 12px 40px rgba(37, 99, 235, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg-soft);
      color: var(--text);
      display: flex; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Sidebar */
    aside {
      width: 240px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 22px 0;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-sm);
    }
    .brand {
      padding: 0 18px 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .brand-row {
      display: flex; align-items: center; gap: 10px; position: relative;
    }
    .brand a.logo {
      display: inline-block;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .brand a.logo:hover { text-decoration: none; }
    .brand a.logo strong { color: var(--primary); font-weight: 700; }
    .brand .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; padding-left: 4px; }

    /* Hamburger + sister-sites menu */
    .hamburger-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: all .12s; padding: 0;
    }
    .hamburger-btn:hover {
      background: var(--bg-soft); color: var(--primary);
      border-color: var(--border-strong);
    }
    /* v1.9.118 — hamburger → left slide-in drawer (Google Cloud style) */
    .brand-menu {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 320px; max-width: 86vw;
      background: #fff;
      border: none; border-right: 1px solid var(--border);
      border-radius: 0;
      box-shadow: 6px 0 28px rgba(15, 23, 42, .18);
      padding: 0;
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform .26s cubic-bezier(.4, 0, .2, 1);
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .brand-menu.is-open { transform: translateX(0); }
    .brand-drawer-backdrop {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, .42);
      z-index: 999;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .brand-drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
    .brand-drawer-head {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: #fff; z-index: 1;
    }
    .brand-drawer-head .title { font-size: 17px; font-weight: 700; flex: 1; letter-spacing: -0.01em; }
    .brand-drawer-head .title strong { color: var(--primary); }
    .brand-drawer-close {
      width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent;
      cursor: pointer; color: var(--text-muted); font-size: 18px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-drawer-close:hover { background: var(--bg-soft); color: var(--text); }
    .brand-menu-body { padding: 10px; }
    .brand-menu-head {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 600;
      padding: 10px 12px 6px;
    }
    .brand-menu-item {
      display: block; padding: 10px 12px;
      border-radius: 8px; text-decoration: none;
      color: var(--text); transition: background .1s;
    }
    .brand-menu-item:hover { background: var(--bg-soft); text-decoration: none; }
    .brand-menu-item .name { display: block; font-size: 14px; font-weight: 600; }
    .brand-menu-item .name strong { color: var(--primary); font-weight: 700; }
    .brand-menu-item .desc { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
    .brand-menu-item.current { background: var(--bg-soft); }
    .brand-menu-item.current .name::after {
      content: '· ปัจจุบัน';
      color: var(--text-muted); font-weight: 400; font-size: 11px; margin-left: 6px;
    }

    .nav { flex: 1; padding: 0 12px; overflow-y: auto; }
    .nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 13px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 3px;
      transition: all .12s;
    }
    .nav a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
    .nav a.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 600;
    }

    /* Sidebar sections */
    .nav-section + .nav-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .nav-section-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      font-weight: 600;
      padding: 2px 13px 8px;
    }
    .nav-section-label .icon { opacity: .7; font-size: 12px; }

    /* Collapsible nav group (parent + children) — ใช้กับ Members/Teams/Access Requests */
    .nav-group { margin-bottom: 3px; }
    .nav-group-toggle {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 10px 13px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 3px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: all .12s;
    }
    .nav-group-toggle:hover { background: var(--bg-hover); color: var(--text); }
    .nav-group-toggle.has-active { color: var(--text); font-weight: 600; }
    .nav-group-toggle .nav-group-label { flex: 1; }
    .nav-group-toggle .nav-group-caret {
      font-size: 10px;
      transition: transform .15s;
      opacity: .6;
    }
    .nav-group.collapsed .nav-group-caret { transform: rotate(-90deg); }
    .nav-group.collapsed .nav-group-children { display: none; }
    .nav-group-children {
      display: flex; flex-direction: column;
      padding-left: 22px;
      margin-bottom: 6px;
      gap: 1px;
    }
    .nav-group-children a {
      padding: 7px 11px;
      font-size: 12.5px;
      font-weight: 500;
      border-left: 2px solid var(--border);
      border-radius: 0 6px 6px 0;
      margin-bottom: 0 !important;
    }
    .nav-group-children a.active {
      border-left-color: var(--primary);
    }

    /* SVG nav icons (ใช้ทั้ง rail + mobile) — เส้น stroke สีเทา monochrome */
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .nav-icon svg { width: 19px; height: 19px; stroke-width: 1.8; }

    /* v1.9.99/101 — Rail mode: icon + label ใต้ icon (Google Ads style) — desktop only */
    @media (min-width: 769px) {
      body > aside {
        width: 92px;
        padding: 14px 0;
      }
      body > aside .brand {
        padding: 0 10px 10px;
        margin-bottom: 8px;
      }
      body > aside .brand-row { justify-content: center; }
      body > aside .brand a.logo,
      body > aside .brand .sub,
      body > aside .nav-section-label,
      body > aside .nav-group-caret,
      body > aside .profile-info,
      body > aside .profile-caret,
      body > aside #nav-group-members-badge,
      body > aside #nav-req-badge {
        display: none !important;
      }
      body > aside .nav { padding: 0 6px; }
      body > aside .nav-section + .nav-section {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
      }
      /* รายการ nav: จัด icon บน + label ล่าง (column) */
      body > aside .nav a,
      body > aside .nav-group-toggle {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 11px 4px;
        position: relative;
        text-align: center;
      }
      /* icon ใหญ่ขึ้น + สีเทา */
      body > aside .nav-icon { color: var(--text-soft); }
      body > aside .nav-icon svg { width: 25px; height: 25px; stroke-width: 1.65; }
      /* label ใต้ icon: เทา เล็ก, wrap ได้ 2 บรรทัด */
      body > aside .nav-label,
      body > aside .nav-group-label {
        display: block !important;
        font-size: 10px;
        font-weight: 500;
        color: var(--text-soft);
        line-height: 1.25;
        white-space: normal;
        word-break: break-word;
        max-width: 100%;
        flex: none;
      }
      /* hover: เข้มขึ้น */
      body > aside .nav a:hover .nav-icon,
      body > aside .nav a:hover .nav-label,
      body > aside .nav-group-toggle:hover .nav-icon,
      body > aside .nav-group-toggle:hover .nav-group-label {
        color: var(--text);
      }
      /* active: primary */
      body > aside .nav a.active { background: var(--primary-soft); }
      body > aside .nav a.active .nav-icon,
      body > aside .nav a.active .nav-label,
      body > aside .nav-group-toggle.has-active .nav-icon,
      body > aside .nav-group-toggle.has-active .nav-group-label {
        color: var(--primary-dark);
      }
      /* Group flyout: position to the right of toggle on hover (with bridge to prevent close) */
      body > aside .nav-group { position: relative; }
      body > aside .nav-group .nav-group-children {
        display: none;
        position: absolute;
        left: calc(100% + 6px);
        top: -4px;
        min-width: 220px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px !important;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(15,23,42,.18);
        gap: 1px;
        text-align: left;
      }
      /* bridge to fill the 6px gap so cursor can move from toggle to popover without closing */
      body > aside .nav-group .nav-group-children::before {
        content: '';
        position: absolute;
        left: -10px; top: 0; bottom: 0; width: 12px;
      }
      body > aside .nav-group:hover .nav-group-children,
      body > aside .nav-group.rail-pinned .nav-group-children {
        display: flex !important;
      }
      body > aside .nav-group .nav-group-children a {
        flex-direction: row;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        border-left: none;
        border-radius: 6px;
        white-space: nowrap;
        text-align: left;
      }
      body > aside .nav-group .nav-group-children a:hover {
        background: var(--bg-hover);
      }
      body > aside .nav-group .nav-group-children a.active {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }
      /* Sidebar footer: avatar only */
      body > aside .sidebar-footer { padding: 8px; }
      body > aside .profile-current {
        justify-content: center;
        padding: 6px;
        gap: 0;
      }
      body > aside .profile-avatar {
        width: 38px; height: 38px;
        font-size: 14px;
      }
      /* Profile menu: pop to the right instead of upward */
      body > aside .profile-menu {
        left: calc(100% + 6px) !important;
        right: auto !important;
        bottom: 0 !important;
        top: auto !important;
        transform: none !important;
        min-width: 240px;
      }
    }

    /* v1.9.103 — บัญชีของฉัน 2-column layout (เมนูซ้าย + รายละเอียดขวา) */
    .acc-layout { display: flex; gap: 18px; align-items: flex-start; }
    .acc-menu {
      width: 230px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 4px;
      position: sticky; top: 16px;
    }
    .acc-menu-item {
      display: flex; align-items: center; gap: 11px;
      padding: 12px 14px; border-radius: 10px;
      background: transparent; border: 1px solid transparent; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--text-muted); text-align: left; width: 100%;
      box-sizing: border-box; transition: all .12s;
    }
    .acc-menu-item .acc-menu-ico { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
    .acc-menu-item:hover { background: var(--bg-hover); color: var(--text); }
    .acc-menu-item.active {
      background: var(--primary-soft); color: var(--primary-dark);
      font-weight: 600; border-color: rgba(37,99,235,.20);
    }
    /* v1.9.234 — ตัวเลข badge ท้ายเมนูย่อย */
    .acc-menu-item .acc-menu-badge {
      margin-left: auto; flex-shrink: 0; font-size: 12px; font-weight: 700;
      font-variant-numeric: tabular-nums; padding: 1px 9px; border-radius: 999px;
      background: var(--bg-soft); color: var(--text-muted);
    }
    .acc-menu-item.active .acc-menu-badge { background: rgba(37,99,235,.15); color: var(--primary-dark); }
    /* v1.9.155 — group header ใน submenu */
    .acc-menu-group {
      font-size: 11px; font-weight: 700; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: .06em;
      padding: 12px 14px 5px; margin-top: 2px;
    }
    .acc-menu-group:first-child { margin-top: 0; padding-top: 4px; }
    .acc-detail { flex: 1; min-width: 0; }

    /* v1.9.129 — Supervised member detail: right slide-out panel (M365 style) */
    .sup-panel-wrap { position: fixed; inset: 0; z-index: 1100; }
    .sup-panel-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,.32); opacity: 0; transition: opacity .24s; }
    .sup-panel-wrap.is-open .sup-panel-backdrop { opacity: 1; }
    .sup-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 480px; max-width: 94vw;
      background: var(--bg-card); box-shadow: -8px 0 30px rgba(15,23,42,.2);
      transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sup-panel-wrap.is-open .sup-panel { transform: translateX(0); }
    .bp-chip { font-size: 9.5px; padding: 1px 7px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; line-height: 1.6; transition: background .12s, color .12s, border-color .12s; }
    .bp-chip:hover { background: rgba(124,58,237,.15); border-color: #7c3aed; color: #7c3aed; }
    .bp-chip.is-pinned { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: 700; }
    .sup-panel-head { display: flex; justify-content: flex-end; padding: 12px 16px 0; }
    .sup-panel-close { width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent; cursor: pointer; font-size: 17px; color: var(--text-muted); }
    .sup-panel-close:hover { background: var(--bg-soft); color: var(--text); }
    .sup-panel-body { padding: 0 24px 28px; }
    .sup-tab { padding: 8px 4px; border: none; background: transparent; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .sup-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    @media (max-width: 700px) {
      .acc-layout { flex-direction: column; }
      .acc-menu {
        width: 100%; flex-direction: row; overflow-x: auto;
        position: static; padding-bottom: 4px;
      }
      .acc-menu-item { white-space: nowrap; width: auto; }
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      position: relative;
    }

    /* Profile switcher */
    .profile-switcher { position: relative; }
    .profile-current {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 10px;
      background: transparent; border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer; font-family: inherit;
      transition: all .12s;
      text-align: left;
    }
    .profile-current:hover {
      background: var(--bg-hover);
      border-color: var(--border);
    }
    .profile-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; font-weight: 700; font-size: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 13px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile-role {
      font-size: 11px; color: var(--text-muted);
      margin-top: 1px;
    }
    .profile-caret {
      color: var(--text-muted); flex-shrink: 0;
    }

    .profile-menu {
      position: absolute;
      bottom: calc(100% + 4px); left: 12px; right: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, .15);
      padding: 6px;
      z-index: 100;
      max-height: 400px; overflow-y: auto;
    }
    .profile-menu-head {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); font-weight: 600;
      padding: 8px 10px 4px;
    }
    .profile-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 8px 10px;
      background: transparent; border: none;
      border-radius: 8px; cursor: pointer;
      font-family: inherit; text-align: left;
      transition: background .1s;
      color: var(--text);
    }
    .profile-item:hover { background: var(--bg-hover); }
    .profile-item.active { background: var(--bg-soft); }
    .profile-item-info { flex: 1; min-width: 0; }
    .profile-item-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile-item-role { font-size: 11px; color: var(--text-muted); }
    .profile-item-check { color: var(--green); font-weight: 700; }

    .profile-menu hr {
      border: none; border-top: 1px solid var(--border);
      margin: 4px 6px;
    }
    .profile-action {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 9px 10px;
      background: transparent; border: none;
      border-radius: 8px; cursor: pointer;
      font-family: inherit; text-align: left;
      font-size: 13px; color: var(--text);
      transition: background .1s;
    }
    .profile-action:hover { background: var(--bg-hover); }
    .profile-action.danger { color: var(--critical); }
    .profile-action.danger:hover { background: rgba(220,38,38,.06); }
    .profile-action-icon {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; opacity: .8;
    }

    /* Main */
    main { flex: 1; padding: 32px 36px; overflow-y: auto; }
    main.no-pad { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    main.no-pad iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }

    .page-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 22px;
    }
    h2.page-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .crumb { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
    .crumb a { color: var(--text-muted); }

    button.btn, .btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all .12s;
    }
    button.btn:hover {
      background: var(--bg-hover); border-color: var(--border-strong);
    }
    button.btn.primary {
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border-color: transparent;
      color: #fff;
      box-shadow: var(--shadow-md);
    }
    button.btn.primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, .3);
    }
    button.btn.danger {
      background: transparent; color: var(--critical);
      border-color: rgba(220, 38, 38, .25);
    }
    button.btn.danger:hover { background: rgba(220, 38, 38, .06); border-color: var(--critical); }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
      transition: all .15s;
      box-shadow: var(--shadow-sm);
    }
    .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .card-clickable { cursor: pointer; }
    .card-clickable:hover { border-color: var(--primary); }
    .card-title { font-size: 15px; font-weight: 600; }
    .card-sub { color: var(--text-muted); font-size: 12.5px; margin-top: 3px; }
    .card-sub code {
      background: var(--bg-soft);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* v1.9.253 — Skeleton loading */
    @keyframes skel-shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
    .skel {
      background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-hover) 37%, var(--bg-soft) 63%);
      background-size: 200% 100%;
      animation: skel-shimmer 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
    @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
    .skel-line { height: 11px; }
    .skel-card {
      display: flex; gap: 13px; align-items: center;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 11px; padding: 11px 14px; margin-bottom: 0;
    }
    .skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px; }
    .skel-stack { display: flex; flex-direction: column; gap: 8px; }

    /* v1.9.271 — Config table (Domain / Hosting / SSL / Others) */
    .cfg-table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg-card); box-shadow: var(--shadow-sm); }
    .cfg-table-scroll { overflow-x: auto; }
    .cfg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cfg-table thead th { text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; padding: 11px 14px; background: var(--bg-soft); white-space: nowrap; }
    .cfg-table tbody td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
    .cfg-table tbody tr { cursor: pointer; transition: background .12s; }
    .cfg-table tbody tr:hover { background: var(--bg-soft); }
    .kebab-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted); padding: 3px 9px; border-radius: 7px; line-height: 1; }
    .kebab-btn:hover { background: var(--bg-hover); color: var(--text); }
    .kebab-pop { position: fixed; z-index: 2200; background: var(--bg-card); border: 1px solid var(--border); border-radius: 11px; box-shadow: 0 10px 30px rgba(15,23,42,.2); padding: 5px; min-width: 178px; }
    .kebab-pop button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: none; border: none; padding: 8px 11px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: 13px; }
    .kebab-pop button:hover { background: var(--bg-soft); }

    /* v1.9.278 — Workflow builder */
    .wf-canvas { position: relative; width: 100%; height: calc(100vh - 210px); min-height: 500px; background: var(--bg-soft); background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 22px 22px; border: 1px solid var(--border); border-radius: 12px; overflow: auto; }
    .wf-edges { position: absolute; top: 0; left: 0; width: 4000px; height: 3000px; pointer-events: none; z-index: 1; overflow: visible; }
    .wf-node { position: absolute; width: 216px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 13px; box-shadow: 0 3px 12px rgba(15,23,42,.09); user-select: none; z-index: 2; }
    .wf-node.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.18); }
    .wf-node-head { display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: grab; font-weight: 700; font-size: 13px; }
    .wf-node-head:active { cursor: grabbing; }
    .wf-node-ico { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .wf-node-body { padding: 0 11px 10px; }
    .wf-port { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--bg-card); border: 2.5px solid var(--primary); cursor: crosshair; z-index: 4; }
    .wf-port.in { left: -8px; top: 50%; transform: translateY(-50%); }
    .wf-port.out { right: -8px; }
    .wf-port:hover { background: var(--primary); transform: translateY(-50%) scale(1.25); }
    .wf-port.out:hover { transform: scale(1.25); }
    .wf-palette-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1.5px dashed var(--border); border-radius: 11px; background: var(--bg-card); cursor: grab; margin-bottom: 9px; transition: border-color .12s, background .12s; }
    .wf-palette-item:hover { border-color: var(--primary); background: var(--bg-soft); }
    .wf-palette-item:active { cursor: grabbing; }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, .35);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      width: 440px;
      max-width: 92vw;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
    }
    .modal-wide  { width: 720px; }
    .modal-xwide { width: 920px; }
    .modal h3 { margin: 0 0 14px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 18px;
    }
    /* v1.9.217 — slide-in modal variant (สไลด์จากขวา ใช้ฟอร์ม showModal เดิม) */
    .modal-bg.is-slide { justify-content: flex-end; align-items: stretch; backdrop-filter: blur(2px); }
    .modal-bg.is-slide .modal {
      border-radius: 0; margin: 0; height: 100vh; max-height: 100vh; max-width: 96vw;
      box-shadow: -8px 0 30px rgba(15,23,42,.22);
      transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .modal-bg.is-slide.is-open .modal { transform: translateX(0); }
    /* v1.9.217 — hardware card คลิกได้ทั้งใบ */
    .hw-card { cursor: pointer; transition: box-shadow .14s, border-color .14s; }
    .hw-card:hover { border-color: var(--primary); box-shadow: 0 3px 12px rgba(37,99,235,.12); }
    .hw-card .hw-chev { color: var(--text-muted); opacity: .45; transition: transform .14s, opacity .14s, color .14s; }
    .hw-card:hover .hw-chev { opacity: 1; transform: translateX(2px); color: var(--primary); }
    /* v1.9.137 — searchable member picker (รูป+ชื่อ+ทีม) */
    .mpick-trigger:hover { border-color: var(--accent); }
    .mpick-item:hover { background: rgba(124,58,237,.08); }
    /* v1.9.140 — member actions overflow menu (⋮ เพิ่มเติม) */
    .m-menu-item:hover { background: var(--bg-soft); }
    .m-kebab:hover { background: var(--bg-hover); }
    /* v1.9.161 — Ads metrics table */
    .ads-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .ads-table th { padding: 8px 10px; font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; border-bottom: 1px solid var(--border); }
    .ads-table td { padding: 8px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
    .ads-table .tnum { text-align: right; font-variant-numeric: tabular-nums; }
    .ads-acc-row { cursor: pointer; }
    .ads-acc-row:hover { background: var(--bg-hover); }
    .ads-camp-row > td { background: var(--bg-soft); }
    .ads-camp-row[data-bench-camp]:hover > td { background: var(--bg-hover); }
    .ads-tot-row > td { font-weight: 700; background: var(--bg-soft); border-top: 2px solid var(--border); }
    /* v1.9.147 — toggle switch (Privacy) */
    .tgl { display: inline-flex; cursor: pointer; flex-shrink: 0; }
    .tgl-input { display: none; }
    .tgl-track { width: 46px; height: 26px; border-radius: 999px; background: var(--border-strong); position: relative; transition: background .16s; }
    .tgl-input:checked + .tgl-track { background: var(--green); }
    .tgl-thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .16s; box-shadow: 0 1px 3px rgba(15,23,42,.25); }
    .tgl-input:checked + .tgl-track .tgl-thumb { left: 23px; }
    /* Two-column layout for fields (used in wide modals) */
    .field-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }
    @media (max-width: 600px) {
      .field-grid-2 { grid-template-columns: 1fr; }
    }
    /* Teams page: 2-col on desktop, stack on mobile */
    @media (max-width: 800px) {
      #teams-layout { grid-template-columns: 1fr !important; }
      #teams-sidebar { position: static !important; max-height: none !important; }
    }
    /* v1.9.78 — Mobile-friendly admin (hamburger menu) */
    .mobile-topbar { display: none; }
    .mobile-backdrop { display: none; }
    @media (max-width: 768px) {
      body { padding-top: 54px; }
      .mobile-topbar {
        display: flex;
        position: fixed; top: 0; left: 0; right: 0; height: 54px;
        background: var(--bg-card); border-bottom: 1px solid var(--border);
        z-index: 150; align-items: center; gap: 12px; padding: 0 14px;
        box-shadow: 0 1px 3px rgba(15,23,42,.08);
      }
      .mobile-topbar-toggle {
        background: transparent; border: 1px solid var(--border);
        border-radius: 8px; width: 38px; height: 38px;
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; color: var(--text); padding: 0; font-size: 20px; line-height: 1;
        flex-shrink: 0;
      }
      .mobile-topbar-toggle:active { background: var(--bg-soft); }
      .mobile-topbar-title {
        font-weight: 700; font-size: 14.5px; color: var(--text);
        flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        letter-spacing: -0.01em;
      }
      /* Sidebar: slide-in drawer */
      aside {
        position: fixed; left: 0; top: 0; bottom: 0;
        width: 282px; max-width: 86vw;
        transform: translateX(-100%); transition: transform .22s ease;
        z-index: 220; box-shadow: 6px 0 24px rgba(15,23,42,.22);
      }
      aside.is-open { transform: translateX(0); }
      /* Backdrop */
      .mobile-backdrop {
        display: block; position: fixed; inset: 0;
        background: rgba(15,23,42,.5); z-index: 200;
        opacity: 0; pointer-events: none; transition: opacity .2s ease;
      }
      .mobile-backdrop.is-open { opacity: 1; pointer-events: auto; }
      /* Main: reduce padding + push down for topbar */
      main { padding: 16px 14px; }
      .page-head {
        flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 14px;
      }
      h2.page-title { font-size: 18px; }
    }
    .field-section-label {
      grid-column: 1 / -1;
      font-size: 11.5px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 14px 0 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .field-section-label:first-child { margin-top: 0; padding-top: 0; border-top: none; }
    .field-span-2 { grid-column: 1 / -1; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
    .field input, .field textarea {
      width: 100%;
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: inherit;
      transition: border .15s, box-shadow .15s;
    }
    .field input:focus, .field textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .hint { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; line-height: 1.5; }
    .hint code {
      background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; font-size: 11px;
    }

    /* Credentials list */
    /* Members table — multi-line cells */
    .members-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      background: var(--bg-card);
    }
    .members-table thead tr { background: var(--bg-soft); }
    .members-table thead th {
      text-align: left; padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600; font-size: 11.5px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .members-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .members-table tbody tr:hover { background: var(--bg-soft); }
    .members-table tbody tr:last-child { border-bottom: none; }
    .members-table tbody td { padding: 14px; vertical-align: middle; }
    .m-row {
      font-size: 12.5px; color: var(--text);
      line-height: 1.5; margin-top: 1px;
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .m-row-muted {
      font-size: 11px; color: var(--text-muted);
      margin-top: 3px;
    }
    .m-name-link:hover {
      color: var(--primary) !important;
      text-decoration: underline;
    }

    /* Inline editable fields (Notion-style click-to-edit) */
    .inline-edit {
      cursor: text;
      transition: background .12s, box-shadow .12s;
    }
    .inline-edit:hover { background: var(--bg-hover) !important; }
    .inline-edit:focus { background: var(--primary-soft) !important; box-shadow: 0 0 0 2px rgba(37,99,235,.18); }
    .inline-edit:empty::before {
      content: attr(data-empty-msg);
      color: var(--text-soft);
      font-style: italic;
    }
    /* Logo box hover hint */
    #sd-logo:hover {
      border-color: var(--primary) !important;
      background: var(--primary-soft) !important;
    }

    /* Credential access rows (in modal) — Notion/Linear style */
    .m-access-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg-card);
      transition: all .12s;
    }
    .m-access-row:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .m-access-row.m-access-on {
      background: var(--primary-soft);
      border-color: rgba(37,99,235,.35);
    }
    .m-access-row.m-access-on:hover {
      background: rgba(37,99,235,.14);
    }
    .m-access-cb {
      width: 17px; height: 17px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--primary);
    }
    .m-access-cb:disabled { cursor: not-allowed; opacity: .8; }
    .m-access-avatar {
      width: 34px; height: 34px;
      border-radius: 9px;
      color: #fff;
      font-weight: 700; font-size: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .m-access-text { flex: 1; min-width: 0; overflow: hidden; }
    .m-access-name {
      font-size: 14px; font-weight: 600; color: var(--text);
      line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .m-access-sub {
      font-size: 11.5px; color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .cred-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      font-size: 13px;
      box-shadow: var(--shadow-sm);
    }
    .cred-row:hover { border-color: var(--border-strong); }
    .cred-row .col-label { font-weight: 600; }
    .cred-row .col-pw { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cred-chip {
      display: inline-flex; align-items: center;
      padding: 2px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 500;
      background: var(--bg-soft); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .cred-chip-cancelled {
      background: rgba(220,38,38,.10); color: var(--critical);
      border-color: rgba(220,38,38,.20);
    }
    .pw-mask { color: var(--text-muted); }
    .pw-show { color: var(--text); user-select: all; }
    .copy-btn {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 13px; padding: 3px 5px;
      border-radius: 4px;
    }
    .copy-btn:hover { color: var(--primary); background: var(--bg-hover); }

    .warning-box {
      background: linear-gradient(135deg, rgba(245, 158, 11, .06), rgba(245, 158, 11, .12));
      border: 1px solid rgba(245, 158, 11, .35);
      color: #92400e;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .warning-box code {
      background: rgba(146, 64, 14, .12); padding: 1px 5px; border-radius: 4px;
    }

    /* Platforms grid — compact 2-col rows (logo | info) */
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .platform-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: all .15s;
      min-height: 64px;
    }
    .platform-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
      text-decoration: none;
    }
    .platform-card-info {
      flex: 1;
      min-width: 0;       /* IMPORTANT — ทำให้ truncate ทำงาน */
      overflow: hidden;
    }

    /* === Spotlight team filter — highlight platforms that selected team uses === */
    /* Team badge — มุมขวาบนของ card (เล็กลง สำหรับ compact layout) */
    .p-team-badge {
      position: absolute; top: 6px; right: 8px;
      background: rgba(124, 58, 237, .14);
      color: #6d28d9;
      font-size: 9.5px; font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid rgba(124, 58, 237, .25);
      pointer-events: none;
      z-index: 2;
      max-width: 110px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* When spotlight is on, dim cards that team doesn't use */
    #p-list.spotlight-on .platform-card[data-team-uses="0"] {
      opacity: 0.4;
      filter: saturate(0.5);
    }
    #p-list.spotlight-on .platform-card[data-team-uses="0"]:hover {
      opacity: 0.85;
      filter: saturate(1);
    }
    /* Team uses + I can use → solid green spotlight */
    #p-list.spotlight-on .platform-card[data-team-uses="1"]:not(.platform-card-disabled) {
      border-color: #10b981 !important;
      box-shadow:
        0 0 0 2px rgba(16, 185, 129, .14),
        0 8px 24px rgba(16, 185, 129, .15);
      background: linear-gradient(180deg, rgba(16,185,129,.04), var(--bg-card));
    }
    #p-list.spotlight-on .platform-card[data-team-uses="1"]:not(.platform-card-disabled):hover {
      box-shadow:
        0 0 0 3px rgba(16, 185, 129, .22),
        0 12px 32px rgba(16, 185, 129, .25);
    }
    #p-list.spotlight-on .platform-card[data-team-uses="1"]:not(.platform-card-disabled) .p-team-badge {
      background: rgba(16, 185, 129, .15);
      color: #15803d;
      border-color: rgba(16, 185, 129, .35);
    }
    /* Team uses + I can't use → orange/amber spotlight (highlighted but disabled) */
    #p-list.spotlight-on .platform-card.platform-card-disabled[data-team-uses="1"] {
      opacity: 1 !important;
      filter: none !important;
      border: 2px solid #f59e0b !important;
      box-shadow:
        0 0 0 2px rgba(245, 158, 11, .14),
        0 6px 18px rgba(245, 158, 11, .18);
      background: linear-gradient(180deg, rgba(245,158,11,.06), var(--bg-soft));
    }
    #p-list.spotlight-on .platform-card.platform-card-disabled[data-team-uses="1"] .p-team-badge {
      background: rgba(245, 158, 11, .18);
      color: #b45309;
      border-color: rgba(245, 158, 11, .40);
    }
    .platform-avatar {
      width: 44px; height: 44px; border-radius: 10px;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      color: #fff; font-weight: 700; font-size: 17px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(37, 99, 235, .20);
    }
    .platform-name {
      font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
      line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .platform-url {
      font-size: 11.5px; color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .platform-meta {
      font-size: 11px; color: var(--text-soft);
      margin-top: 5px;
